appId: ${APP_ID}
---
# Analysis YTD navigation: verify back/forward buttons navigate between years.

- launchApp:
    clearState: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Finance"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Analysis"
      tap: true

- runFlow:
    file: _scroll_find.yaml
    env:
      element: "YTD"
      tap: true
- assertVisible: "YTD"
- tapOn: "Previous period"
- assertVisible: "YTD"
- tapOn: "Next period"
- assertVisible: "YTD"
