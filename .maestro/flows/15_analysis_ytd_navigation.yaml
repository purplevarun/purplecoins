appId: ${APP_ID}
---
# Analysis YTD navigation: verify back/forward buttons navigate between years.

- launchApp:
    clearState: true
- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "Finance"
- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "Analysis"

- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "YTD"
- assertVisible: "YTD"
- tapOn: "Previous period"
- assertVisible: "YTD"
- tapOn: "Next period"
- assertVisible: "YTD"
