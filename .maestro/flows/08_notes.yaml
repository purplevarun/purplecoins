appId: ${APP_ID}
---
# Notes: create a folder inline from the note form, create a note in it,
# edit it, then delete it.

- launchApp:
    clearState: true
- scrollUntilVisible:
    element: "Switch homepage"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Switch homepage"
    direction: up
- tapOn: "Switch homepage"
- scrollUntilVisible:
    element: "Tools"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Tools"
    direction: up
- tapOn: "Tools"
- scrollUntilVisible:
    element: "Notes"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Notes"
    direction: up
- tapOn: "Notes"

- scrollUntilVisible:
    element: "Add"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Add"
    direction: up
- tapOn: "Add"
- assertVisible: "New note"
- scrollUntilVisible:
    element: "Note title"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Note title"
    direction: up
- tapOn: "Note title"
- inputText: "Grocery list"
- hideKeyboard
- scrollUntilVisible:
    element: "Write something useful..."
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Write something useful..."
    direction: up
- tapOn: "Write something useful..."
- inputText: "Milk, eggs, bread"
- hideKeyboard

# Create a folder inline via the FolderPicker.
- scrollUntilVisible:
    element: "New folder"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "New folder"
    direction: up
- tapOn: "New folder"
- scrollUntilVisible:
    element: "Folder name"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Folder name"
    direction: up
- tapOn: "Folder name"
- inputText: "Personal"
- hideKeyboard
- scrollUntilVisible:
    element: "Create"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Create"
    direction: up
- tapOn: "Create"
- assertVisible: "Personal"

- scrollUntilVisible:
    element: "Save note"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Save note"
    direction: up
- tapOn: "Save note"
- assertVisible: "Grocery list"
- assertVisible: "Personal"

# Edit the note.
- scrollUntilVisible:
    element: "Grocery list"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Grocery list"
    direction: up
- tapOn: "Grocery list"
- assertVisible: "Edit note"
- scrollUntilVisible:
    element: "Grocery list"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Grocery list"
    direction: up
- tapOn: "Grocery list"
- eraseText
- inputText: "Weekend grocery list"
- hideKeyboard
- scrollUntilVisible:
    element: "Save note"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Save note"
    direction: up
- tapOn: "Save note"
- assertVisible: "Weekend grocery list"

# Delete the note.
- scrollUntilVisible:
    element: "Weekend grocery list"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Weekend grocery list"
    direction: up
- tapOn: "Weekend grocery list"
- scrollUntilVisible:
    element: "Delete note"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Delete note"
    direction: up
- tapOn: "Delete note"
- assertVisible: "Delete note?"
- scrollUntilVisible:
    element: "Delete"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Delete"
    direction: up
- tapOn: "Delete"
- assertNotVisible: "Weekend grocery list"
