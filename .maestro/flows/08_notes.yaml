appId: ${APP_ID}
---
# Notes: create a folder inline from the note form, create a note in it,
# edit it, then delete it.

- launchApp:
    clearState: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Switch homepage"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Tools"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Notes"
      tap: true

- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Add"
      tap: true
- assertVisible: "New note"
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Note title"
      tap: true
- inputText: "Grocery list"
- hideKeyboard
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Write something useful..."
      tap: true
- inputText: "Milk, eggs, bread"
- hideKeyboard

# Create a folder inline via the FolderPicker.
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "New folder"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Folder name"
      tap: true
- inputText: "Personal"
- hideKeyboard
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Create"
      tap: true
- assertVisible: "Personal"

- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Save note"
      tap: true
- assertVisible: "Grocery list"
- assertVisible: "Personal"

# Edit the note.
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Grocery list"
      tap: true
- assertVisible: "Edit note"
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Grocery list"
      tap: true
- eraseText
- inputText: "Weekend grocery list"
- hideKeyboard
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Save note"
      tap: true
- assertVisible: "Weekend grocery list"

# Delete the note.
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Weekend grocery list"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Delete note"
      tap: true
- assertVisible: "Delete note?"
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Delete"
      tap: true
- assertNotVisible: "Weekend grocery list"
