appId: ${APP_ID}
---
# Notes: create a folder inline from the note form, create a note in it,
# edit it, then delete it.

- launchApp:
    clearState: true
- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "Tools"
- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "Notes"

- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "Add"
- assertVisible: "New note"
- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "Note title"
- inputText: "Grocery list"
- hideKeyboard
- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "Write something useful..."
- inputText: "Milk, eggs, bread"
- hideKeyboard

# Create a folder inline via the FolderPicker.
- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "New folder"
- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "Folder name"
- inputText: "Personal"
- hideKeyboard
- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "Create"
- assertVisible: "Personal"

- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "Save note"
- assertVisible: "Grocery list"
- assertVisible: "Personal"

# Edit the note.
- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "Grocery list"
- assertVisible: "Edit note"
- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "Grocery list"
- eraseText
- inputText: "Weekend grocery list"
- hideKeyboard
- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "Save note"
- assertVisible: "Weekend grocery list"

# Delete the note.
- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "Weekend grocery list"
- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "Delete note"
- assertVisible: "Delete note?"
- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "Delete"
- assertNotVisible: "Weekend grocery list"
