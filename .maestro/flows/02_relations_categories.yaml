appId: ${APP_ID}
---
# Categories: create an expense + income category, switch the category
# type selector, verify the reclassification warning dialog, then archive.

- launchApp:
    clearState: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Categories"
      tap: true

- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Add"
      tap: true
- assertVisible: "New category"
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Category name"
      tap: true
- inputText: "Groceries"
- hideKeyboard
- assertVisible: "Expense"
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Save"
      tap: true
- assertVisible: "Groceries"
- assertVisible: "Expense category"

- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Add"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Category name"
      tap: true
- inputText: "Salary"
- hideKeyboard
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Income"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Save"
      tap: true
- assertVisible: "Salary"
- assertVisible: "Income category"

# Editing an existing category's type prompts a confirmation because it
# reclassifies historical analysis.
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Groceries"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Edit"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Income"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Save"
      tap: true
- assertVisible: "Change analysis classification?"
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Change"
      tap: true
- back
- assertVisible: "Income category"

# Archive the Salary category.
- tapOn:
    text: "Archive"
    below: "Salary"
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Archive"
      tap: true
- assertNotVisible: "Salary"
