appId: ${APP_ID}
---
# Categories: create an expense + income category, switch the category
# type selector, verify the reclassification warning dialog, then archive.

- launchApp:
    clearState: true
- scrollUntilVisible:
    element: "Switch homepage"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Switch homepage"
    direction: up
- tapOn: "Switch homepage"
- scrollUntilVisible:
    element: "Finance"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Finance"
    direction: up
- tapOn: "Finance"
- scrollUntilVisible:
    element: "Categories"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Categories"
    direction: up
- tapOn: "Categories"

- scrollUntilVisible:
    element: "Add"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Add"
    direction: up
- tapOn: "Add"
- assertVisible: "New category"
- scrollUntilVisible:
    element: "Category name"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Category name"
    direction: up
- tapOn: "Category name"
- inputText: "Groceries"
- hideKeyboard
- assertVisible: "Expense"
- scrollUntilVisible:
    element: "Save"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Save"
    direction: up
- tapOn: "Save"
- assertVisible: "Groceries"
- assertVisible: "Expense category"

- scrollUntilVisible:
    element: "Add"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Add"
    direction: up
- tapOn: "Add"
- scrollUntilVisible:
    element: "Category name"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Category name"
    direction: up
- tapOn: "Category name"
- inputText: "Salary"
- hideKeyboard
- scrollUntilVisible:
    element: "Income"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Income"
    direction: up
- tapOn: "Income"
- scrollUntilVisible:
    element: "Save"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Save"
    direction: up
- tapOn: "Save"
- assertVisible: "Salary"
- assertVisible: "Income category"

# Editing an existing category's type prompts a confirmation because it
# reclassifies historical analysis.
- scrollUntilVisible:
    element: "Groceries"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Groceries"
    direction: up
- tapOn: "Groceries"
- scrollUntilVisible:
    element: "Edit"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Edit"
    direction: up
- tapOn: "Edit"
- scrollUntilVisible:
    element: "Income"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Income"
    direction: up
- tapOn: "Income"
- scrollUntilVisible:
    element: "Save"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Save"
    direction: up
- tapOn: "Save"
- assertVisible: "Change analysis classification?"
- scrollUntilVisible:
    element: "Change"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Change"
    direction: up
- tapOn: "Change"
- back
- assertVisible: "Income category"

# Archive the Salary category.
- tapOn:
    text: "Archive"
    below: "Salary"
- scrollUntilVisible:
    element: "Archive"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Archive"
    direction: up
- tapOn: "Archive"
- assertNotVisible: "Salary"
