appId: ${APP_ID}
---
# Settings: default home mode, native-currency toggle, FY start month,
# default trip, budget alerts, auto-backup (Android only), and the
# backup/restore entry points. The native OS share sheet (export) and
# document picker (restore) are outside the app's own UI, so this flow
# verifies the app-side triggers rather than driving the OS chooser itself.

- launchApp:
    clearState: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Settings"
      tap: true
- assertVisible: "Currency display"

# Native currency display toggle (label + switch are separate elements).
- tapOn:
    rightOf: "Native currencies"

# Financial year start month.
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Apr"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Jul"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: ".*FY ends in.*"
- runFlow:
    file: _scroll_find.yaml
    env:
      element: ".*Jun.*"

# Archived relations is reachable (covered in depth by 01_relations_sources).
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Archived relations"
      tap: true
- back

# Budget alerts card is visible (Phase 2 — cross-platform).
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Budget alerts"
      tap: true
- assertVisible: "Enable budget alerts"

# Automatic backups card is Android-only; the assertion is wrapped in a
# conditional so the flow still passes on iOS builds.
- runFlow:
    when:
      platform: Android
    commands:
      - runFlow:
          file: _scroll_find.yaml
          env:
            element: "Automatic backups"
            tap: true
      - assertVisible: "Enable auto-backup"
      - scrollUntilVisible:
          element: "Choose backup folder"
          direction: down
      - assertVisible: "Choose backup folder"

# Export prepares a backup and invokes the native share sheet.
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Export .purplecoins"
      tap: true
- back
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Backup prepared successfully."
      tap: true
- assertVisible: "Backup prepared successfully."

# Restore prompts a destructive-action confirmation before opening the
# native document picker. The picker itself is outside the app, so the
# flow cancels rather than proceeding to "Choose backup".
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Restore .purplecoins"
      tap: true
- assertVisible: "Restore backup?"
- assertVisible: "This replaces every record currently stored on this phone."
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Cancel"
      tap: true
