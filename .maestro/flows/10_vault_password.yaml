    direction: down
    optional: true
- scrollUntilVisible:
    element: "Switch homepage"
    direction: up
- tapOn: "Switch homepage"
- scrollUntilVisible:
    element: "Vault"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Vault"
    direction: up
- tapOn: "Vault"
- scrollUntilVisible:
    element: "Passwords"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Passwords"
    direction: up
- tapOn: "Passwords"

- scrollUntilVisible:
    element: "Add"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Add"
    direction: up
- tapOn: "Add"
- assertVisible: "New password"
- scrollUntilVisible:
