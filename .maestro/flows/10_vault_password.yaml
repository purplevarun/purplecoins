appId: ${APP_ID}
---
# Vault > Passwords: create, copy password (has a visible button label),
# edit, then delete.

- launchApp:
    clearState: true
- runFlow:
    file: find_and_tap.yaml
    env:
      element: "Switch homepage"
- runFlow:
    file: find_and_tap.yaml
    env:
      element: "Vault"
- runFlow:
    file: find_and_tap.yaml
    env:
      element: "Passwords"

- runFlow:
    file: find_and_tap.yaml
    env:
      element: "Add"
- assertVisible: "New password"
- runFlow:
    file: find_and_tap.yaml
    env:
      element: "Entry title"
- inputText: "Email"
- hideKeyboard
- runFlow:
    file: find_and_tap.yaml
    env:
      element: "Username or email"
- inputText: "me@example.com"
- hideKeyboard
- runFlow:
    file: find_and_tap.yaml
    env:
      element: "Password"
- inputText: "S3cret!Pass"
- hideKeyboard
- runFlow:
    file: find_and_tap.yaml
    env:
      element: "https://"
- inputText: "https://mail.example.com"
- hideKeyboard
- runFlow:
    file: find_and_tap.yaml
    env:
      element: "Save entry"
- assertVisible: "Email"
- assertVisible: "me@example.com"

- runFlow:
    file: find_and_tap.yaml
    env:
      element: "Copy password"
- assertVisible: "Password copied."

- runFlow:
    file: find_and_tap.yaml
    env:
      element: "Email"
- assertVisible: "Edit password"
- runFlow:
    file: find_and_tap.yaml
    env:
      element: "Email"
- eraseText
- inputText: "Work email"
- hideKeyboard
- runFlow:
    file: find_and_tap.yaml
    env:
      element: "Save entry"
- assertVisible: "Work email"

- runFlow:
    file: find_and_tap.yaml
    env:
      element: "Work email"
- runFlow:
    file: find_and_tap.yaml
    env:
      element: "Delete entry"
- assertVisible: "Delete vault entry?"
- runFlow:
    file: find_and_tap.yaml
    env:
      element: "Delete"
- assertNotVisible: "Work email"
