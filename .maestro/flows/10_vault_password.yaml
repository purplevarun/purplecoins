    direction: up
- tapOn: "https://"
- inputText: "https://mail.example.com"
- hideKeyboard
- scrollUntilVisible:
    element: "Save entry"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Save entry"
    direction: up
- tapOn: "Save entry"
- assertVisible: "Email"
- assertVisible: "me@example.com"

- scrollUntilVisible:
    element: "Copy password"
    direction: down
    optional: true
