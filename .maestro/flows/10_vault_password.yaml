appId: ${APP_ID}
---
# Vault > Passwords: create, copy password (has a visible button label),
# edit, then delete.

- launchApp:
    clearState: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Vault"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Passwords"
      tap: true

- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Add"
      tap: true
- assertVisible: "New password"
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Entry title"
      tap: true
- inputText: "Email"
- hideKeyboard
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Username or email"
      tap: true
- inputText: "me@example.com"
- hideKeyboard
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Password"
      tap: true
- inputText: "S3cret!Pass"
- hideKeyboard
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "https://"
      tap: true
- inputText: "https://mail.example.com"
- hideKeyboard
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Save entry"
      tap: true
- assertVisible: "Email"
- assertVisible: "me@example.com"

- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Copy password"
      tap: true
- assertVisible: "Password copied."

- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Email"
      tap: true
- assertVisible: "Edit password"
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Email"
      tap: true
- eraseText
- inputText: "Work email"
- hideKeyboard
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Save entry"
      tap: true
- assertVisible: "Work email"

- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Work email"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Delete entry"
      tap: true
- assertVisible: "Delete vault entry?"
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Delete"
      tap: true
- assertNotVisible: "Work email"
