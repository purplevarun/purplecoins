appId: ${APP_ID}
---
# Vault > Passwords: create, copy password (has a visible button label),
# edit, then delete.

- launchApp:
    clearState: true
- tapOn: "Switch homepage"
- tapOn: "Vault"
- tapOn: "Passwords"

- tapOn: "Add"
- assertVisible: "New password"
- tapOn: "Entry title"
- inputText: "Email"
- hideKeyboard
- tapOn: "Username or email"
- inputText: "me@example.com"
- hideKeyboard
- tapOn: "Password"
- inputText: "S3cret!Pass"
- hideKeyboard
- tapOn: "https://"
- inputText: "https://mail.example.com"
- hideKeyboard
- tapOn: "Save entry"
- assertVisible: "Email"
- assertVisible: "me@example.com"

- tapOn: "Copy password"
- assertVisible: "Password copied."

- tapOn: "Email"
- assertVisible: "Edit password"
- tapOn: "Email"
- eraseText
- inputText: "Work email"
- hideKeyboard
- tapOn: "Save entry"
- assertVisible: "Work email"

- tapOn: "Work email"
- tapOn: "Delete entry"
- assertVisible: "Delete vault entry?"
- tapOn: "Delete"
- assertNotVisible: "Work email"
