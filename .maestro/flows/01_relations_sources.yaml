appId: ${APP_ID}
---
# Sources: create (INR + USD), list ordering, rename, validate, archive,
# restore from Settings > Archived relations, and the duplicate-name guard.

- launchApp:
    clearState: true
- scrollUntilVisible:
    element: "Switch homepage"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Switch homepage"
    direction: up
- tapOn: "Switch homepage"
- scrollUntilVisible:
    element: "Finance"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Finance"
    direction: up
- tapOn: "Finance"
- scrollUntilVisible:
    element: "Sources"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Sources"
    direction: up
- tapOn: "Sources"

# Create the first source (default currency INR).
- scrollUntilVisible:
    element: "Add"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Add"
    direction: up
- tapOn: "Add"
- assertVisible: "New source"
- scrollUntilVisible:
    element: "Source name"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Source name"
    direction: up
- tapOn: "Source name"
- inputText: "Everyday Bank"
- hideKeyboard
- assertVisible: "INR"
- scrollUntilVisible:
    element: "Save"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Save"
    direction: up
- tapOn: "Save"
- assertVisible: "Everyday Bank"

# Create a second source with a different currency.
- scrollUntilVisible:
    element: "Add"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Add"
    direction: up
- tapOn: "Add"
- scrollUntilVisible:
    element: "Source name"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Source name"
    direction: up
- tapOn: "Source name"
- inputText: "Travel Card"
- hideKeyboard
- scrollUntilVisible:
    element: "INR"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "INR"
    direction: up
- tapOn: "INR"
- eraseText
- inputText: "USD"
- hideKeyboard
- scrollUntilVisible:
    element: "Save"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Save"
    direction: up
- tapOn: "Save"
- assertVisible: "Travel Card"
- assertVisible: "Everyday Bank"

# Duplicate name is rejected.
- scrollUntilVisible:
    element: "Add"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Add"
    direction: up
- tapOn: "Add"
- scrollUntilVisible:
    element: "Source name"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Source name"
    direction: up
- tapOn: "Source name"
- inputText: "Everyday Bank"
- hideKeyboard
- scrollUntilVisible:
    element: "Save"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Save"
    direction: up
- tapOn: "Save"
- assertVisible:
    text: ".*already exists.*"
    optional: true
- back

# Validate the first source (adds a "Validated" badge).
- tapOn:
    text: "Validate"
    below: "Everyday Bank"
- assertVisible: "Validated"

# Rename it — currency becomes read-only once created.
- scrollUntilVisible:
    element: "Everyday Bank"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Everyday Bank"
    direction: up
- tapOn: "Everyday Bank"
- scrollUntilVisible:
    element: "Edit"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Edit"
    direction: up
- tapOn: "Edit"
- assertVisible: ".*Currency is fixed after a source is created\\..*"
- scrollUntilVisible:
    element: "Everyday Bank"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Everyday Bank"
    direction: up
- tapOn: "Everyday Bank"
- eraseText
- inputText: "Primary Bank"
- hideKeyboard
- scrollUntilVisible:
    element: "Save"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Save"
    direction: up
- tapOn: "Save"
- back
- assertVisible: "Primary Bank"

# Archive it, confirm it disappears from the active list, then restore it
# from Settings > Archived relations.
- tapOn:
    text: "Archive"
    below: "Primary Bank"
- scrollUntilVisible:
    element: "Archive"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Archive"
    direction: up
- tapOn: "Archive"
- assertNotVisible: "Primary Bank"
- assertVisible: "Travel Card"

- back
- scrollUntilVisible:
    element: "Settings"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Settings"
    direction: up
- tapOn: "Settings"
- scrollUntilVisible:
    element: "Settings"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Settings"
    direction: up
- tapOn: "Settings"
- scrollUntilVisible:
    element: "Archived relations"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Archived relations"
    direction: up
- tapOn: "Archived relations"
- assertVisible: "Primary Bank"
- scrollUntilVisible:
    element: "Primary Bank"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Primary Bank"
    direction: up
- tapOn: "Primary Bank"
- scrollUntilVisible:
    element: "Restore"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Restore"
    direction: up
- tapOn: "Restore"
- assertNotVisible: "Primary Bank"
