appId: ${APP_ID}
---
# Sources: create (INR + USD), list ordering, rename, validate, archive,
# restore from Settings > Archived relations, and the duplicate-name guard.

- launchApp:
    clearState: true
- runFlow:
    name: find_and_tap
    args:
      element: "Switch homepage"
- runFlow:
    name: find_and_tap
    args:
      element: "Finance"
- runFlow:
    name: find_and_tap
    args:
      element: "Sources"

# Create the first source (default currency INR).
- runFlow:
    name: find_and_tap
    args:
      element: "Add"
- assertVisible: "New source"
- runFlow:
    name: find_and_tap
    args:
      element: "Source name"
- inputText: "Everyday Bank"
- hideKeyboard
- assertVisible: "INR"
- runFlow:
    name: find_and_tap
    args:
      element: "Save"
- assertVisible: "Everyday Bank"

# Create a second source with a different currency.
- runFlow:
    name: find_and_tap
    args:
      element: "Add"
- runFlow:
    name: find_and_tap
    args:
      element: "Source name"
- inputText: "Travel Card"
- hideKeyboard
- runFlow:
    name: find_and_tap
    args:
      element: "INR"
- eraseText
- inputText: "USD"
- hideKeyboard
- runFlow:
    name: find_and_tap
    args:
      element: "Save"
- assertVisible: "Travel Card"
- assertVisible: "Everyday Bank"

# Duplicate name is rejected.
- runFlow:
    name: find_and_tap
    args:
      element: "Add"
- runFlow:
    name: find_and_tap
    args:
      element: "Source name"
- inputText: "Everyday Bank"
- hideKeyboard
- runFlow:
    name: find_and_tap
    args:
      element: "Save"
- assertVisible:
    text: ".*already exists.*"
    optional: true
- back

# Validate the first source (adds a "Validated" badge).
- tapOn:
    text: "Validate"
    below: "Everyday Bank"
- assertVisible: "Validated"

# Rename it — currency becomes read-only once created.
- runFlow:
    name: find_and_tap
    args:
      element: "Everyday Bank"
- runFlow:
    name: find_and_tap
    args:
      element: "Edit"
- assertVisible: ".*Currency is fixed after a source is created\\..*"
- runFlow:
    name: find_and_tap
    args:
      element: "Everyday Bank"
- eraseText
- inputText: "Primary Bank"
- hideKeyboard
- runFlow:
    name: find_and_tap
    args:
      element: "Save"
- back
- assertVisible: "Primary Bank"

# Archive it, confirm it disappears from the active list, then restore it
# from Settings > Archived relations.
- tapOn:
    text: "Archive"
    below: "Primary Bank"
- runFlow:
    name: find_and_tap
    args:
      element: "Archive"
- assertNotVisible: "Primary Bank"
- assertVisible: "Travel Card"

- back
- runFlow:
    name: find_and_tap
    args:
      element: "Settings"
- runFlow:
    name: find_and_tap
    args:
      element: "Settings"
- runFlow:
    name: find_and_tap
    args:
      element: "Archived relations"
- assertVisible: "Primary Bank"
- runFlow:
    name: find_and_tap
    args:
      element: "Primary Bank"
- runFlow:
    name: find_and_tap
    args:
      element: "Restore"
- assertNotVisible: "Primary Bank"
