appId: ${APP_ID}
---
# Vault > Cards: create a credit card, copy its number/CVV/PIN, edit,
# then delete.

- launchApp:
    clearState: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Switch homepage"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Vault"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Cards"
      tap: true

- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Add"
      tap: true
- assertVisible: "New card"
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Personal Visa"
      tap: true
- inputText: "Everyday Visa"
- hideKeyboard
- assertVisible: "Credit card"
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Card number"
      tap: true
- inputText: "4111111111111111"
- hideKeyboard
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Visa, Mastercard, RuPay..."
      tap: true
- inputText: "Visa"
- hideKeyboard
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "MM/YY"
      tap: true
- inputText: "12/30"
- hideKeyboard
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "CVV"
      tap: true
- inputText: "123"
- hideKeyboard
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "PIN"
      tap: true
- inputText: "4321"
- hideKeyboard
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Save entry"
      tap: true
- assertVisible: "Everyday Visa"
- assertVisible: ".*Visa.*"

- tapOn:
    id: "copy-card-number"
- assertVisible: "Card number copied."
- tapOn:
    id: "copy-cvv"
- assertVisible: "CVV copied."
- tapOn:
    id: "copy-pin"
- assertVisible: "PIN copied."

# Switch card type to Debit while editing.
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Everyday Visa"
      tap: true
- assertVisible: "Edit card"
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Credit card"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Debit card"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Save entry"
      tap: true
- assertVisible: ".*Debit card.*"

- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Everyday Visa"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Delete entry"
      tap: true
- assertVisible: "Delete vault entry?"
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Delete"
      tap: true
- assertNotVisible: "Everyday Visa"
