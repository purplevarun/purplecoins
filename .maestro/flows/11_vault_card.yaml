appId: ${APP_ID}
---
# Vault > Cards: create a credit card, copy its number/CVV/PIN, edit,
# then delete.

- launchApp:
    clearState: true
- scrollUntilVisible:
    element: "Switch homepage"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Switch homepage"
    direction: up
- tapOn: "Switch homepage"
- scrollUntilVisible:
    element: "Vault"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Vault"
    direction: up
- tapOn: "Vault"
- scrollUntilVisible:
    element: "Cards"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Cards"
    direction: up
- tapOn: "Cards"

- scrollUntilVisible:
    element: "Add"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Add"
    direction: up
- tapOn: "Add"
- assertVisible: "New card"
- scrollUntilVisible:
    element: "Personal Visa"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Personal Visa"
    direction: up
- tapOn: "Personal Visa"
- inputText: "Everyday Visa"
- hideKeyboard
- assertVisible: "Credit card"
- scrollUntilVisible:
    element: "Card number"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Card number"
    direction: up
- tapOn: "Card number"
- inputText: "4111111111111111"
- hideKeyboard
- scrollUntilVisible:
    element: "Visa, Mastercard, RuPay..."
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Visa, Mastercard, RuPay..."
    direction: up
- tapOn: "Visa, Mastercard, RuPay..."
- inputText: "Visa"
- hideKeyboard
- scrollUntilVisible:
    element: "MM/YY"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "MM/YY"
    direction: up
- tapOn: "MM/YY"
- inputText: "12/30"
- hideKeyboard
- scrollUntilVisible:
    element: "CVV"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "CVV"
    direction: up
- tapOn: "CVV"
- inputText: "123"
- hideKeyboard
- scrollUntilVisible:
    element: "PIN"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "PIN"
    direction: up
- tapOn: "PIN"
- inputText: "4321"
- hideKeyboard
- scrollUntilVisible:
    element: "Save entry"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Save entry"
    direction: up
- tapOn: "Save entry"
- assertVisible: "Everyday Visa"
- assertVisible: ".*Visa.*"

- tapOn:
    id: "copy-card-number"
- assertVisible: "Card number copied."
- tapOn:
    id: "copy-cvv"
- assertVisible: "CVV copied."
- tapOn:
    id: "copy-pin"
- assertVisible: "PIN copied."

# Switch card type to Debit while editing.
- scrollUntilVisible:
    element: "Everyday Visa"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Everyday Visa"
    direction: up
- tapOn: "Everyday Visa"
- assertVisible: "Edit card"
- scrollUntilVisible:
    element: "Credit card"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Credit card"
    direction: up
- tapOn: "Credit card"
- scrollUntilVisible:
    element: "Debit card"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Debit card"
    direction: up
- tapOn: "Debit card"
- scrollUntilVisible:
    element: "Save entry"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Save entry"
    direction: up
- tapOn: "Save entry"
- assertVisible: ".*Debit card.*"

- scrollUntilVisible:
    element: "Everyday Visa"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Everyday Visa"
    direction: up
- tapOn: "Everyday Visa"
- scrollUntilVisible:
    element: "Delete entry"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Delete entry"
    direction: up
- tapOn: "Delete entry"
- assertVisible: "Delete vault entry?"
- scrollUntilVisible:
    element: "Delete"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Delete"
    direction: up
- tapOn: "Delete"
- assertNotVisible: "Everyday Visa"
