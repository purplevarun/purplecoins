appId: ${APP_ID}
---
# Vault > Cards: create a credit card, copy its number/CVV/PIN, edit,
# then delete.

- launchApp:
    clearState: true
- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "Vault"
- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "Cards"

- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "Add"
- assertVisible: "New card"
- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "Personal Visa"
- inputText: "Everyday Visa"
- hideKeyboard
- assertVisible: "Credit card"
- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "Card number"
- inputText: "4111111111111111"
- hideKeyboard
- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "Visa, Mastercard, RuPay..."
- inputText: "Visa"
- hideKeyboard
- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "MM/YY"
- inputText: "12/30"
- hideKeyboard
- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "CVV"
- inputText: "123"
- hideKeyboard
- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "PIN"
- inputText: "4321"
- hideKeyboard
- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "Save entry"
- assertVisible: "Everyday Visa"
- assertVisible: ".*Visa.*"

- tapOn:
    id: "copy-card-number"
- assertVisible: "Card number copied."
- tapOn:
    id: "copy-cvv"
- assertVisible: "CVV copied."
- tapOn:
    id: "copy-pin"
- assertVisible: "PIN copied."

# Switch card type to Debit while editing.
- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "Everyday Visa"
- assertVisible: "Edit card"
- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "Credit card"
- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "Debit card"
- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "Save entry"
- assertVisible: ".*Debit card.*"

- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "Everyday Visa"
- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "Delete entry"
- assertVisible: "Delete vault entry?"
- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "Delete"
- assertNotVisible: "Everyday Visa"
