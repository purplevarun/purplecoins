appId: ${APP_ID}
---
# Vault > Identity: create, edit, delete. Identities have no copy buttons.

- launchApp:
    clearState: true
- runFlow:
    name: find_and_tap
    args:
      element: "Switch homepage"
- runFlow:
    name: find_and_tap
    args:
      element: "Vault"
- runFlow:
    name: find_and_tap
    args:
      element: "Identity"

- runFlow:
    name: find_and_tap
    args:
      element: "Add"
- assertVisible: "New identity"
- runFlow:
    name: find_and_tap
    args:
      element: "Entry title"
- inputText: "Passport"
- hideKeyboard
- runFlow:
    name: find_and_tap
    args:
      element: "Document number"
- inputText: "P1234567"
- hideKeyboard
- runFlow:
    name: find_and_tap
    args:
      element: "Optional notes"
- inputText: "Expires 2030"
- hideKeyboard
- runFlow:
    name: find_and_tap
    args:
      element: "Save entry"
- assertVisible: "Passport"
- assertVisible: "P1234567"

- runFlow:
    name: find_and_tap
    args:
      element: "Passport"
- assertVisible: "Edit identity"
- runFlow:
    name: find_and_tap
    args:
      element: "Passport"
- eraseText
- inputText: "Passport (renewed)"
- hideKeyboard
- runFlow:
    name: find_and_tap
    args:
      element: "Save entry"
- assertVisible: "Passport (renewed)"

- runFlow:
    name: find_and_tap
    args:
      element: "Passport (renewed)"
- runFlow:
    name: find_and_tap
    args:
      element: "Delete entry"
- assertVisible: "Delete vault entry?"
- runFlow:
    name: find_and_tap
    args:
      element: "Delete"
- assertNotVisible: "Passport (renewed)"
