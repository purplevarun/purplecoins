appId: ${APP_ID}
---
# Analysis: create a category + transaction so a non-empty breakdown
# renders, then cycle through the period selector and reach exchange
# rates via the in-screen link.

- launchApp:
    clearState: true
- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "Switch homepage"
- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "Finance"

- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "Sources"
- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "Add"
- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "Source name"
- inputText: "Bank"
- hideKeyboard
- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "Save"
- back

- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "Categories"
- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "Add"
- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "Category name"
- inputText: "Food"
- hideKeyboard
- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "Save"
- back

- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "Transactions"
- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "Add"
- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "Select source"
- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "Bank"
- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "0.00"
- inputText: "500"
- hideKeyboard
- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "Select category"
- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "Food"
- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "What was this for?"
- inputText: "Groceries"
- hideKeyboard
- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "Save transaction"
- back

- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "Analysis"
- assertVisible: "Month"
- scrollUntilVisible:
    element: "Food"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Food"
    direction: up
- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "Year"
- scrollUntilVisible:
    element: "Food"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Food"
    direction: up
- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "All"
- scrollUntilVisible:
    element: "Food"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Food"
    direction: up
- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "FY"
- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "YTD"

- runFlow:
    file: _find_and_tap.yaml
    env:
      element: "Manage exchange rates"
- assertVisible: "Fetch latest rates"
