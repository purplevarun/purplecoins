appId: ${APP_ID}
---
# Analysis: create a category + transaction so a non-empty breakdown
# renders, then cycle through the period selector and reach exchange
# rates via the in-screen link.

- launchApp:
    clearState: true
- tapOn: "Switch homepage"
- tapOn: "Finance"

- tapOn: "Sources"
- tapOn: "Add"
- tapOn: "Source name"
- inputText: "Bank"
- hideKeyboard
- tapOn: "Save"
- back

- tapOn: "Categories"
- tapOn: "Add"
- tapOn: "Category name"
- inputText: "Food"
- hideKeyboard
- tapOn: "Save"
- back

- tapOn: "Transactions"
- tapOn: "Add"
- tapOn: "Select source"
- tapOn: "Bank"
- tapOn: "0.00"
- inputText: "500"
- hideKeyboard
- tapOn: "Select category"
- tapOn: "Food"
- tapOn: "What was this for?"
- inputText: "Groceries"
- hideKeyboard
- scrollUntilVisible:
    element: "Save transaction"
- tapOn: "Save transaction"
- back

- tapOn: "Analysis"
- assertVisible: "Month"
- scrollUntilVisible:
    element: "Food"
    timeout: 10000
- tapOn: "Year"
- scrollUntilVisible:
    element: "Food"
    timeout: 10000
- tapOn: "All"
- scrollUntilVisible:
    element: "Food"
    timeout: 10000
- tapOn: "FY"
- tapOn: "YTD"

- scrollUntilVisible:
    element: "Manage exchange rates"
- tapOn: "Manage exchange rates"
- assertVisible: "Fetch latest rates"
