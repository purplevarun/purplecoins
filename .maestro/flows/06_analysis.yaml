appId: ${APP_ID}
---
# Analysis: create a category + transaction so a non-empty breakdown
# renders, then cycle through the period selector and reach exchange
# rates via the in-screen link.

- launchApp:
    clearState: true

- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Sources"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Add"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Source name"
      tap: true
- inputText: "Bank"
- hideKeyboard
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Save"
      tap: true
- back

- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Categories"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Add"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Category name"
      tap: true
- inputText: "Food"
- hideKeyboard
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Save"
      tap: true
- back

- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Transactions"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Add"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Select source"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Bank"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "0.00"
      tap: true
- inputText: "500"
- hideKeyboard
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Select category"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Food"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "What was this for?"
      tap: true
- inputText: "Groceries"
- hideKeyboard
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Save transaction"
      tap: true
- back

- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Analysis"
      tap: true
- assertVisible: "Month"
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Food"
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Year"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Food"
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "All"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Food"
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "FY"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "YTD"
      tap: true

- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Manage exchange rates"
      tap: true
- assertVisible: "Fetch latest rates"
