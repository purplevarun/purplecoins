appId: ${APP_ID}
---
# Trips and Investments: simple create + duplicate-name guard for both
# "simple entity" relation kinds (no extra fields beyond name).

- launchApp:
    clearState: true
- tapOn: "Switch homepage"
- tapOn: "Finance"

- tapOn: "Trips"
- tapOn: "Add"
- assertVisible: "New trip"
- tapOn: "Trip name"
- inputText: "Goa Getaway"
- hideKeyboard
- tapOn: "Save"
- assertVisible: "Goa Getaway"

- tapOn: "Add"
- tapOn: "Trip name"
- inputText: "Goa Getaway"
- hideKeyboard
- tapOn: "Save"
- assertVisible:
    text: ".*already exists.*"
    optional: true
- back
- back

- tapOn: "Investments"
- tapOn: "Add"
- assertVisible: "New investment"
- tapOn: "Investment name"
- inputText: "Index Fund"
- hideKeyboard
- tapOn: "Save"
- assertVisible: "Index Fund"
