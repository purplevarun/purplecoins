appId: ${APP_ID}
---
# Trips and Investments: simple create + duplicate-name guard for both
# "simple entity" relation kinds (no extra fields beyond name).

- launchApp:
    clearState: true

- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Trips"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Add"
      tap: true
- assertVisible: "New trip"
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Trip name"
      tap: true
- inputText: "Goa Getaway"
- hideKeyboard
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Save"
      tap: true
- assertVisible: "Goa Getaway"

- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Add"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Trip name"
      tap: true
- inputText: "Goa Getaway"
- hideKeyboard
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Save"
      tap: true
- assertVisible:
    text: ".*already exists.*"
    optional: true
- back
- back

- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Investments"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Add"
      tap: true
- assertVisible: "New investment"
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Investment name"
      tap: true
- inputText: "Index Fund"
- hideKeyboard
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Save"
      tap: true
- assertVisible: "Index Fund"
