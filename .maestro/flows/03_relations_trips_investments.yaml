appId: ${APP_ID}
---
# Trips and Investments: simple create + duplicate-name guard for both
# "simple entity" relation kinds (no extra fields beyond name).

- launchApp:
    clearState: true
- runFlow:
    file: find_and_tap.yaml
    env:
      element: "Switch homepage"
- runFlow:
    file: find_and_tap.yaml
    env:
      element: "Finance"

- runFlow:
    file: find_and_tap.yaml
    env:
      element: "Trips"
- runFlow:
    file: find_and_tap.yaml
    env:
      element: "Add"
- assertVisible: "New trip"
- runFlow:
    file: find_and_tap.yaml
    env:
      element: "Trip name"
- inputText: "Goa Getaway"
- hideKeyboard
- runFlow:
    file: find_and_tap.yaml
    env:
      element: "Save"
- assertVisible: "Goa Getaway"

- runFlow:
    file: find_and_tap.yaml
    env:
      element: "Add"
- runFlow:
    file: find_and_tap.yaml
    env:
      element: "Trip name"
- inputText: "Goa Getaway"
- hideKeyboard
- runFlow:
    file: find_and_tap.yaml
    env:
      element: "Save"
- assertVisible:
    text: ".*already exists.*"
    optional: true
- back
- back

- runFlow:
    file: find_and_tap.yaml
    env:
      element: "Investments"
- runFlow:
    file: find_and_tap.yaml
    env:
      element: "Add"
- assertVisible: "New investment"
- runFlow:
    file: find_and_tap.yaml
    env:
      element: "Investment name"
- inputText: "Index Fund"
- hideKeyboard
- runFlow:
    file: find_and_tap.yaml
    env:
      element: "Save"
- assertVisible: "Index Fund"
