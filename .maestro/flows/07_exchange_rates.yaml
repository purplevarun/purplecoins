appId: ${APP_ID}
---
# Exchange rates: only currencies used by a non-INR source appear here.
# Creates a USD source, then sets and edits a manual rate.

- launchApp:
    clearState: true
- scrollUntilVisible:
    element: "Switch homepage"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Switch homepage"
    direction: up
- tapOn: "Switch homepage"
- scrollUntilVisible:
    element: "Finance"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Finance"
    direction: up
- tapOn: "Finance"

- scrollUntilVisible:
    element: "Sources"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Sources"
    direction: up
- tapOn: "Sources"
- scrollUntilVisible:
    element: "Add"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Add"
    direction: up
- tapOn: "Add"
- scrollUntilVisible:
    element: "Source name"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Source name"
    direction: up
- tapOn: "Source name"
- inputText: "US Account"
- hideKeyboard
- scrollUntilVisible:
    element: "INR"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "INR"
    direction: up
- tapOn: "INR"
- eraseText
- inputText: "USD"
- hideKeyboard
- scrollUntilVisible:
    element: "Save"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Save"
    direction: up
- tapOn: "Save"
- back

- scrollUntilVisible:
    element: "Exchange rates"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Exchange rates"
    direction: up
- tapOn: "Exchange rates"
- assertVisible: "1 USD"
- assertVisible: "Rate not set"
- scrollUntilVisible:
    element: "0.00"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "0.00"
    direction: up
- tapOn: "0.00"
- inputText: "83.50"
- hideKeyboard
- scrollUntilVisible:
    element: "Save manual rate"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Save manual rate"
    direction: up
- tapOn: "Save manual rate"
- assertVisible: "USD rate saved."
- assertVisible: ".*MANUAL.*"

- scrollUntilVisible:
    element: "83.5"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "83.5"
    direction: up
- tapOn: "83.5"
- eraseText
- inputText: "84"
- hideKeyboard
- scrollUntilVisible:
    element: "Save manual rate"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Save manual rate"
    direction: up
- tapOn: "Save manual rate"
- assertVisible: "USD rate saved."
