appId: ${APP_ID}
---
# Exchange rates: only currencies used by a non-INR source appear here.
# Creates a USD source, then sets and edits a manual rate.

- launchApp:
    clearState: true
- runFlow:
    path: find_and_tap.yaml
    args:
      element: "Switch homepage"
- runFlow:
    path: find_and_tap.yaml
    args:
      element: "Finance"

- runFlow:
    path: find_and_tap.yaml
    args:
      element: "Sources"
- runFlow:
    path: find_and_tap.yaml
    args:
      element: "Add"
- runFlow:
    path: find_and_tap.yaml
    args:
      element: "Source name"
- inputText: "US Account"
- hideKeyboard
- runFlow:
    path: find_and_tap.yaml
    args:
      element: "INR"
- eraseText
- inputText: "USD"
- hideKeyboard
- runFlow:
    path: find_and_tap.yaml
    args:
      element: "Save"
- back

- runFlow:
    path: find_and_tap.yaml
    args:
      element: "Exchange rates"
- assertVisible: "1 USD"
- assertVisible: "Rate not set"
- runFlow:
    path: find_and_tap.yaml
    args:
      element: "0.00"
- inputText: "83.50"
- hideKeyboard
- runFlow:
    path: find_and_tap.yaml
    args:
      element: "Save manual rate"
- assertVisible: "USD rate saved."
- assertVisible: ".*MANUAL.*"

- runFlow:
    path: find_and_tap.yaml
    args:
      element: "83.5"
- eraseText
- inputText: "84"
- hideKeyboard
- runFlow:
    path: find_and_tap.yaml
    args:
      element: "Save manual rate"
- assertVisible: "USD rate saved."
