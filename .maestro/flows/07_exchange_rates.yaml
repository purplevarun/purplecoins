appId: ${APP_ID}
---
# Exchange rates: only currencies used by a non-INR source appear here.
# Creates a USD source, then sets and edits a manual rate.

- launchApp:
    clearState: true

- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Sources"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Add"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Source name"
      tap: true
- inputText: "US Account"
- hideKeyboard
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "INR"
      tap: true
- eraseText
- inputText: "USD"
- hideKeyboard
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Save"
      tap: true
- back

- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Exchange rates"
      tap: true
- assertVisible: "1 USD"
- assertVisible: "Rate not set"
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "0.00"
      tap: true
- inputText: "83.50"
- hideKeyboard
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Save manual rate"
      tap: true
- assertVisible: "USD rate saved."
- assertVisible: ".*MANUAL.*"

- runFlow:
    file: _scroll_find.yaml
    env:
      element: "83.5"
      tap: true
- eraseText
- inputText: "84"
- hideKeyboard
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Save manual rate"
      tap: true
- assertVisible: "USD rate saved."
