appId: ${APP_ID}
---
# Budgets: create an expense category + monthly budget, verify it lists,
# edit the amount, then delete it.

- launchApp:
    clearState: true
- runFlow:
    name: find_and_tap
    args:
      element: "Switch homepage"
- runFlow:
    name: find_and_tap
    args:
      element: "Finance"

- runFlow:
    name: find_and_tap
    args:
      element: "Categories"
- runFlow:
    name: find_and_tap
    args:
      element: "Add"
- runFlow:
    name: find_and_tap
    args:
      element: "Category name"
- inputText: "Rent"
- hideKeyboard
- runFlow:
    name: find_and_tap
    args:
      element: "Save"
- back

- runFlow:
    name: find_and_tap
    args:
      element: "Budgets"
- assertVisible: "Budgets use INR and reset on calendar month or calendar year boundaries."
- runFlow:
    name: find_and_tap
    args:
      element: "Add"
- assertVisible: "New budget"
- runFlow:
    name: find_and_tap
    args:
      element: "Select category"
- runFlow:
    name: find_and_tap
    args:
      element: "Rent"
- runFlow:
    name: find_and_tap
    args:
      element: "0.00"
- inputText: "20000"
- hideKeyboard
- assertVisible: "Monthly"
- runFlow:
    name: find_and_tap
    args:
      element: "Save budget"
- assertVisible: "Rent"

- runFlow:
    name: find_and_tap
    args:
      element: "Edit"
- assertVisible: "Edit budget"
- runFlow:
    name: find_and_tap
    args:
      element: "Yearly"
- runFlow:
    name: find_and_tap
    args:
      element: "Save budget"

- runFlow:
    name: find_and_tap
    args:
      element: "Delete"
- assertVisible: "Delete budget?"
- runFlow:
    name: find_and_tap
    args:
      element: "Delete"
- assertNotVisible: "Rent"
