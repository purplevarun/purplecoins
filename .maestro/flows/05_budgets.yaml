appId: ${APP_ID}
---
# Budgets: create an expense category + monthly budget, verify it lists,
# edit the amount, then delete it.

- launchApp:
    clearState: true
- scrollUntilVisible:
    element: "Switch homepage"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Switch homepage"
    direction: up
- tapOn: "Switch homepage"
- scrollUntilVisible:
    element: "Finance"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Finance"
    direction: up
- tapOn: "Finance"

- scrollUntilVisible:
    element: "Categories"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Categories"
    direction: up
- tapOn: "Categories"
- scrollUntilVisible:
    element: "Add"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Add"
    direction: up
- tapOn: "Add"
- scrollUntilVisible:
    element: "Category name"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Category name"
    direction: up
- tapOn: "Category name"
- inputText: "Rent"
- hideKeyboard
- scrollUntilVisible:
    element: "Save"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Save"
    direction: up
- tapOn: "Save"
- back

- scrollUntilVisible:
    element: "Budgets"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Budgets"
    direction: up
- tapOn: "Budgets"
- assertVisible: "Budgets use INR and reset on calendar month or calendar year boundaries."
- scrollUntilVisible:
    element: "Add"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Add"
    direction: up
- tapOn: "Add"
- assertVisible: "New budget"
- scrollUntilVisible:
    element: "Select category"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Select category"
    direction: up
- tapOn: "Select category"
- scrollUntilVisible:
    element: "Rent"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Rent"
    direction: up
- tapOn: "Rent"
- scrollUntilVisible:
    element: "0.00"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "0.00"
    direction: up
- tapOn: "0.00"
- inputText: "20000"
- hideKeyboard
- assertVisible: "Monthly"
- scrollUntilVisible:
    element: "Save budget"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Save budget"
    direction: up
- tapOn: "Save budget"
- assertVisible: "Rent"

- scrollUntilVisible:
    element: "Edit"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Edit"
    direction: up
- tapOn: "Edit"
- assertVisible: "Edit budget"
- scrollUntilVisible:
    element: "Yearly"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Yearly"
    direction: up
- tapOn: "Yearly"
- scrollUntilVisible:
    element: "Save budget"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Save budget"
    direction: up
- tapOn: "Save budget"

- scrollUntilVisible:
    element: "Delete"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Delete"
    direction: up
- tapOn: "Delete"
- assertVisible: "Delete budget?"
- scrollUntilVisible:
    element: "Delete"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Delete"
    direction: up
- tapOn: "Delete"
- assertNotVisible: "Rent"
