appId: ${APP_ID}
---
# Smoke test covering app launch, home navigation, and the Tools / Finance /
# Vault mode switcher. This is the fastest flow to run and is a good
# first check that a build is healthy before running the deeper flows.

- launchApp:
    clearState: true

# Home screen defaults to the "Tools" mode.
- assertVisible: "Purplecoins"
- assertVisible: "Tools"
- assertVisible: "Notes"
- assertVisible: "Todos"

# Switch to Finance via the mode-switcher modal.
- scrollUntilVisible:
    element: "Switch homepage"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Switch homepage"
    direction: up
- tapOn: "Switch homepage"
- assertVisible: "Finance"
- scrollUntilVisible:
    element: "Finance"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Finance"
    direction: up
- tapOn: "Finance"
- assertVisible: "Transactions"
- assertVisible: "Sources"
- assertVisible: "Categories"
- assertVisible: "Trips"
- assertVisible: "Investments"
- assertVisible: "Budgets"
- assertVisible: "Analysis"
- assertVisible: "Exchange rates"

# Switch to Vault.
- scrollUntilVisible:
    element: "Switch homepage"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Switch homepage"
    direction: up
- tapOn: "Switch homepage"
- scrollUntilVisible:
    element: "Vault"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Vault"
    direction: up
- tapOn: "Vault"
- assertVisible: "Passwords"
- assertVisible: "Cards"
- assertVisible: "Identity"

# Back to Tools for the next flow / a clean starting point.
- scrollUntilVisible:
    element: "Switch homepage"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Switch homepage"
    direction: up
- tapOn: "Switch homepage"
- scrollUntilVisible:
    element: "Tools"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Tools"
    direction: up
- tapOn: "Tools"
- assertVisible: "Notes"

# Settings screen is reachable from every mode.
- scrollUntilVisible:
    element: "Settings"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Settings"
    direction: up
- tapOn: "Settings"
- assertVisible: "Home screen"
- back

# Global search is reachable from every mode.
- scrollUntilVisible:
    element: "Search Tools"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Search Tools"
    direction: up
- tapOn: "Search Tools"
- assertVisible: "Type at least two characters."
- back
