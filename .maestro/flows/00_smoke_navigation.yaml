appId: ${APP_ID}
---
# Smoke test: app launches directly on Finance, mode switcher works,
# and Settings is reachable from the header.

- launchApp:
    clearState: true

# App opens on Finance mode — verify key tiles are present.
- assertVisible: "Purplecoins"
- assertVisible: "Finance"
- assertVisible: "Transactions"
- assertVisible: "Sources"
- assertVisible: "Categories"
- assertVisible: "Trips"
- assertVisible: "Investments"
- assertVisible: "Budgets"
- assertVisible: "Analysis"
- assertVisible: "Exchange rates"

# Switch to Vault via the mode-switcher modal.
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Switch homepage"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Vault"
      tap: true
- assertVisible: "Passwords"
- assertVisible: "Cards"
- assertVisible: "Identity"

# Switch to Tools.
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Switch homepage"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Tools"
      tap: true
- assertVisible: "Notes"
- assertVisible: "Todos"

# Settings is reachable from the header.
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Settings"
      tap: true
- assertVisible: "Currency display"
- back

# Settings screen is reachable from every mode.
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Settings"
      tap: true
- assertVisible: "Currency display"
- back

# Global search is reachable from every mode.
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Search Tools"
      tap: true
- assertVisible: "Type at least two characters."
- back
