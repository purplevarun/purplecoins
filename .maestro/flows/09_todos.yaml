appId: ${APP_ID}
---
# Todos: create with a due date, toggle completed via the form switch,
# edit, then delete.

- launchApp:
    clearState: true
- runFlow:
    name: find_and_tap
    args:
      element: "Switch homepage"
- runFlow:
    name: find_and_tap
    args:
      element: "Tools"
- runFlow:
    name: find_and_tap
    args:
      element: "Todos"

- runFlow:
    name: find_and_tap
    args:
      element: "Add"
- assertVisible: "New todo"
- runFlow:
    name: find_and_tap
    args:
      element: "What needs doing?"
- inputText: "Renew passport"
- hideKeyboard
- runFlow:
    name: find_and_tap
    args:
      element: "Optional details"
- inputText: "Book an appointment first"
- hideKeyboard

# Enable the due date switch and accept today's default date.
- tapOn:
    rightOf: "Due date"
- assertVisible: "Due"

- runFlow:
    name: find_and_tap
    args:
      element: "Save todo"
- assertVisible: "Renew passport"
- assertVisible: "Book an appointment first"

# Toggle "Completed" via the edit form (the list's quick-toggle checkbox
# has no accessible label, so this is the reliable path for E2E).
- runFlow:
    name: find_and_tap
    args:
      element: "Renew passport"
- assertVisible: "Edit todo"
- tapOn:
    rightOf: "Completed"
- runFlow:
    name: find_and_tap
    args:
      element: "Save todo"

# Edit the title.
- runFlow:
    name: find_and_tap
    args:
      element: "Renew passport"
- runFlow:
    name: find_and_tap
    args:
      element: "Renew passport"
- eraseText
- inputText: "Renew passport (urgent)"
- hideKeyboard
- runFlow:
    name: find_and_tap
    args:
      element: "Save todo"
- assertVisible: "Renew passport (urgent)"

# Delete it.
- runFlow:
    name: find_and_tap
    args:
      element: "Renew passport (urgent)"
- runFlow:
    name: find_and_tap
    args:
      element: "Delete todo"
- assertVisible: "Delete todo?"
- runFlow:
    name: find_and_tap
    args:
      element: "Delete"
- assertNotVisible: "Renew passport (urgent)"
