appId: ${APP_ID}
---
# Todos: create with a due date, toggle completed via the form switch,
# edit, then delete.

- launchApp:
    clearState: true
- scrollUntilVisible:
    element: "Switch homepage"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Switch homepage"
    direction: up
- tapOn: "Switch homepage"
- scrollUntilVisible:
    element: "Tools"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Tools"
    direction: up
- tapOn: "Tools"
- scrollUntilVisible:
    element: "Todos"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Todos"
    direction: up
- tapOn: "Todos"

- scrollUntilVisible:
    element: "Add"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Add"
    direction: up
- tapOn: "Add"
- assertVisible: "New todo"
- scrollUntilVisible:
    element: "What needs doing?"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "What needs doing?"
    direction: up
- tapOn: "What needs doing?"
- inputText: "Renew passport"
- hideKeyboard
- scrollUntilVisible:
    element: "Optional details"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Optional details"
    direction: up
- tapOn: "Optional details"
- inputText: "Book an appointment first"
- hideKeyboard

# Enable the due date switch and accept today's default date.
- tapOn:
    rightOf: "Due date"
- assertVisible: "Due"

- scrollUntilVisible:
    element: "Save todo"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Save todo"
    direction: up
- tapOn: "Save todo"
- assertVisible: "Renew passport"
- assertVisible: "Book an appointment first"

# Toggle "Completed" via the edit form (the list's quick-toggle checkbox
# has no accessible label, so this is the reliable path for E2E).
- scrollUntilVisible:
    element: "Renew passport"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Renew passport"
    direction: up
- tapOn: "Renew passport"
- assertVisible: "Edit todo"
- tapOn:
    rightOf: "Completed"
- scrollUntilVisible:
    element: "Save todo"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Save todo"
    direction: up
- tapOn: "Save todo"

# Edit the title.
- scrollUntilVisible:
    element: "Renew passport"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Renew passport"
    direction: up
- tapOn: "Renew passport"
- scrollUntilVisible:
    element: "Renew passport"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Renew passport"
    direction: up
- tapOn: "Renew passport"
- eraseText
- inputText: "Renew passport (urgent)"
- hideKeyboard
- scrollUntilVisible:
    element: "Save todo"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Save todo"
    direction: up
- tapOn: "Save todo"
- assertVisible: "Renew passport (urgent)"

# Delete it.
- scrollUntilVisible:
    element: "Renew passport (urgent)"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Renew passport (urgent)"
    direction: up
- tapOn: "Renew passport (urgent)"
- scrollUntilVisible:
    element: "Delete todo"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Delete todo"
    direction: up
- tapOn: "Delete todo"
- assertVisible: "Delete todo?"
- scrollUntilVisible:
    element: "Delete"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Delete"
    direction: up
- tapOn: "Delete"
- assertNotVisible: "Renew passport (urgent)"
