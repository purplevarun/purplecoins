# Reusable mini flow: Search for element (scroll down then up) and tap it
# Parameters:
#   - element: the element text to find and tap
# Usage:
#   - runFlow:
#       path: find_and_tap.yaml
#       args:
#         element: "Budget alerts"

- scrollUntilVisible:
    element: ${element}
    direction: down
    optional: true
- scrollUntilVisible:
    element: ${element}
    direction: up
- tapOn: ${element}
