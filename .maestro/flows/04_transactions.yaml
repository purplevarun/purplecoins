appId: ${APP_ID}
---
# Transactions: full CRUD across DEBIT / CREDIT / TRANSFER, category
# selection, the classification/type filter, search, and clone-via-
# long-press. Creates its own prerequisite sources + category.

- launchApp:
    clearState: true
- runFlow:
    name: find_and_tap
    args:
      element: "Switch homepage"
- runFlow:
    name: find_and_tap
    args:
      element: "Finance"

# --- Prerequisites: two sources + one category ---
- runFlow:
    name: find_and_tap
    args:
      element: "Sources"
- runFlow:
    name: find_and_tap
    args:
      element: "Add"
- runFlow:
    name: find_and_tap
    args:
      element: "Source name"
- inputText: "Bank"
- hideKeyboard
- runFlow:
    name: find_and_tap
    args:
      element: "Save"
- runFlow:
    name: find_and_tap
    args:
      element: "Add"
- runFlow:
    name: find_and_tap
    args:
      element: "Source name"
- inputText: "Wallet"
- hideKeyboard
- runFlow:
    name: find_and_tap
    args:
      element: "Save"
- back

- runFlow:
    name: find_and_tap
    args:
      element: "Categories"
- runFlow:
    name: find_and_tap
    args:
      element: "Add"
- runFlow:
    name: find_and_tap
    args:
      element: "Category name"
- inputText: "Food"
- hideKeyboard
- runFlow:
    name: find_and_tap
    args:
      element: "Save"
- back

# --- DEBIT transaction against a category ---
- runFlow:
    name: find_and_tap
    args:
      element: "Transactions"
- runFlow:
    name: find_and_tap
    args:
      element: "Add"
- assertVisible: "New transaction"
- runFlow:
    name: find_and_tap
    args:
      element: "Select source"
- runFlow:
    name: find_and_tap
    args:
      element: "Bank"
- runFlow:
    name: find_and_tap
    args:
      element: "0.00"
- inputText: "250"
- hideKeyboard
- runFlow:
    name: find_and_tap
    args:
      element: "Select category"
- runFlow:
    name: find_and_tap
    args:
      element: "Food"
- runFlow:
    name: find_and_tap
    args:
      element: "What was this for?"
- inputText: "Lunch"
- hideKeyboard
- runFlow:
    name: find_and_tap
    args:
      element: "Save transaction"
- assertVisible: "Lunch"

# --- CREDIT transaction ---
- runFlow:
    name: find_and_tap
    args:
      element: "Add"
- runFlow:
    name: find_and_tap
    args:
      element: "Credit"
- runFlow:
    name: find_and_tap
    args:
      element: "Select source"
- runFlow:
    name: find_and_tap
    args:
      element: "Bank"
- runFlow:
    name: find_and_tap
    args:
      element: "0.00"
- inputText: "50000"
- hideKeyboard
- runFlow:
    name: find_and_tap
    args:
      element: "Select category"
- runFlow:
    name: find_and_tap
    args:
      element: "Food"
- runFlow:
    name: find_and_tap
    args:
      element: "What was this for?"
- inputText: "Refund"
- hideKeyboard
- runFlow:
    name: find_and_tap
    args:
      element: "Save transaction"
- assertVisible: "Refund"

# --- TRANSFER between the two sources ---
- runFlow:
    name: find_and_tap
    args:
      element: "Add"
- runFlow:
    name: find_and_tap
    args:
      element: "Transfer"
- runFlow:
    name: find_and_tap
    args:
      element: "Select source"
- runFlow:
    name: find_and_tap
    args:
      element: "Bank"
- runFlow:
    name: find_and_tap
    args:
      element: "Select destination"
- runFlow:
    name: find_and_tap
    args:
      element: "Wallet"
- runFlow:
    name: find_and_tap
    args:
      element: "0.00"
- inputText: "1000"
- hideKeyboard
- runFlow:
    name: find_and_tap
    args:
      element: "Save transaction"
- assertVisible: "Bank to Wallet"

# --- Filter by classification ---
- runFlow:
    name: find_and_tap
    args:
      element: "General"
- assertVisible: "Lunch"
- runFlow:
    name: find_and_tap
    args:
      element: "Investment"
- assertVisible: "No transactions found"
- runFlow:
    name: find_and_tap
    args:
      element: "All"
- assertVisible: "Lunch"

# --- Search ---
- runFlow:
    name: find_and_tap
    args:
      element: "Search"
- runFlow:
    name: find_and_tap
    args:
      element: "Search transactions..."
- inputText: "Lunch"
- hideKeyboard
- assertVisible: "Lunch"
- assertNotVisible: "Refund"
- runFlow:
    name: find_and_tap
    args:
      element: "Close search"

# --- Edit the Lunch transaction ---
- runFlow:
    name: find_and_tap
    args:
      element: "Lunch"
- assertVisible: "Edit transaction"
- runFlow:
    name: find_and_tap
    args:
      element: "Lunch"
- eraseText
- inputText: "Lunch with team"
- hideKeyboard
- runFlow:
    name: find_and_tap
    args:
      element: "Save transaction"
- assertVisible: "Lunch with team"

# --- Clone via long-press ---
- longPressOn: "Lunch with team"
- assertVisible: "Clone transaction"
- runFlow:
    name: find_and_tap
    args:
      element: "Save transaction"

# --- Delete the refund transaction ---
- runFlow:
    name: find_and_tap
    args:
      element: "Refund"
- runFlow:
    name: find_and_tap
    args:
      element: "Delete transaction"
- runFlow:
    name: find_and_tap
    args:
      element: "Delete"
- assertNotVisible: "Refund"
