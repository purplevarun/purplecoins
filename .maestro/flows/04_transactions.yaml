appId: ${APP_ID}
---
# Transactions: full CRUD across DEBIT / CREDIT / TRANSFER, category
# selection, the classification/type filter, search, and clone-via-
# long-press. Creates its own prerequisite sources + category.

- launchApp:
    clearState: true

# --- Prerequisites: two sources + one category ---
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Sources"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Add"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Source name"
      tap: true
- inputText: "Bank"
- hideKeyboard
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Save"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Add"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Source name"
      tap: true
- inputText: "Wallet"
- hideKeyboard
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Save"
      tap: true
- back

- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Categories"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Add"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Category name"
      tap: true
- inputText: "Food"
- hideKeyboard
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Save"
      tap: true
- back

# --- DEBIT transaction against a category ---
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Transactions"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Add"
      tap: true
- assertVisible: "New transaction"
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Select source"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Bank"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "0.00"
      tap: true
- inputText: "250"
- hideKeyboard
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Select category"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Food"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "What was this for?"
      tap: true
- inputText: "Lunch"
- hideKeyboard
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Save transaction"
      tap: true
- assertVisible: "Lunch"

# --- CREDIT transaction ---
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Add"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Credit"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Select source"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Bank"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "0.00"
      tap: true
- inputText: "50000"
- hideKeyboard
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Select category"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Food"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "What was this for?"
      tap: true
- inputText: "Refund"
- hideKeyboard
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Save transaction"
      tap: true
- assertVisible: "Refund"

# --- TRANSFER between the two sources ---
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Add"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Transfer"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Select source"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Bank"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Select destination"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Wallet"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "0.00"
      tap: true
- inputText: "1000"
- hideKeyboard
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Save transaction"
      tap: true
- assertVisible: "Bank to Wallet"

# --- Filter by classification ---
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "General"
      tap: true
- assertVisible: "Lunch"
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Investment"
      tap: true
- assertVisible: "No transactions found"
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "All"
      tap: true
- assertVisible: "Lunch"

# --- Search ---
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Search"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Search transactions..."
      tap: true
- inputText: "Lunch"
- hideKeyboard
- assertVisible: "Lunch"
- assertNotVisible: "Refund"
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Close search"
      tap: true

# --- Edit the Lunch transaction ---
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Lunch"
      tap: true
- assertVisible: "Edit transaction"
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Lunch"
      tap: true
- eraseText
- inputText: "Lunch with team"
- hideKeyboard
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Save transaction"
      tap: true
- assertVisible: "Lunch with team"

# --- Clone via long-press ---
- longPressOn: "Lunch with team"
- assertVisible: "Clone transaction"
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Save transaction"
      tap: true

# --- Delete the refund transaction ---
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Refund"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Delete transaction"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Delete"
      tap: true
- assertNotVisible: "Refund"
