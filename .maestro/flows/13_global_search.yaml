appId: ${APP_ID}
---
# Global search: create one item per mode, then verify the search box
# gates on a 2-character minimum and finds the right item per mode.

- launchApp:
    clearState: true

# Tools: a note to search for.
- scrollUntilVisible:
    element: "Notes"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Notes"
    direction: up
- tapOn: "Notes"
- scrollUntilVisible:
    element: "Add"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Add"
    direction: up
- tapOn: "Add"
- scrollUntilVisible:
    element: "Note title"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Note title"
    direction: up
- tapOn: "Note title"
- inputText: "Vacation planning"
- hideKeyboard
- scrollUntilVisible:
    element: "Save note"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Save note"
    direction: up
- tapOn: "Save note"
- back

- scrollUntilVisible:
    element: "Search Tools"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Search Tools"
    direction: up
- tapOn: "Search Tools"
- scrollUntilVisible:
    element: "Search Tools"
    direction: down
    optional: true
- scrollUntilVisible:
    element: "Search Tools"
    direction: up
- tapOn: "Search Tools"
- inputText: "a"
- hideKeyboard
- assertVisible: "Type at least two characters."
- eraseText
- inputText: "vacation"
- hideKeyboard
- assertVisible: "Vacation planning"
- back

