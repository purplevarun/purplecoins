appId: ${APP_ID}
---
# Global search: create one item per mode, then verify the search box
# gates on a 2-character minimum and finds the right item per mode.

- launchApp:
    clearState: true

- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Switch homepage"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Tools"
      tap: true

# Tools: a note to search for.
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Notes"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Add"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Note title"
      tap: true
- inputText: "Vacation planning"
- hideKeyboard
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Save note"
      tap: true
- back

- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Search Tools"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Search Tools"
      tap: true
- inputText: "a"
- hideKeyboard
- assertVisible: "Type at least two characters."
- eraseText
- inputText: "vacation"
- hideKeyboard
- assertVisible: "Vacation planning"
- back

# Finance: a source to search for.
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Switch homepage"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Finance"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Sources"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Add"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Source name"
      tap: true
- inputText: "Zenith Bank"
- hideKeyboard
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Save"
      tap: true
- back

- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Search Finance"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Search Finance"
      tap: true
- inputText: "zenith"
- hideKeyboard
- assertVisible: "Zenith Bank"
- back

# Vault: a password to search for.
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Switch homepage"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Vault"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Passwords"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Add"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Entry title"
      tap: true
- inputText: "Streaming service"
- hideKeyboard
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Password"
      tap: true
- inputText: "hunter2"
- hideKeyboard
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Save entry"
      tap: true
- back

- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Search Vault"
      tap: true
- runFlow:
    file: _scroll_find.yaml
    env:
      element: "Search Vault"
      tap: true
- inputText: "streaming"
- hideKeyboard
- assertVisible: "Streaming service"
