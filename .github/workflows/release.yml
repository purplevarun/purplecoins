name: Release

on:
  workflow_dispatch:

jobs:
  sanity-checks:
    name: Sanity Checks (typecheck, lint, unit tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Make run executable
        run: chmod +x run

      - name: Run sanity checks via run
        run: ./run lint

      - name: Unit tests with coverage
        run: ./run test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  build-android:
    name: Build Android APK (Gradle)
    needs: sanity-checks
    runs-on: ubuntu-latest
    outputs:
      app_id: ${{ steps.release-meta.outputs.app_id }}
      version: ${{ steps.release-meta.outputs.version }}
      tag: ${{ steps.release-meta.outputs.tag }}
      name: ${{ steps.release-meta.outputs.name }}
      apk_name: ${{ steps.release-meta.outputs.apk_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: bun install

      - name: Make run executable
        run: chmod +x run

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build release APK via run
        run: ./run buildCi

      - name: Resolve release metadata
        id: release-meta
        run: |
          app_version=$(cat .version)
          app_id=$(cat .package)
          branch_name="${GITHUB_REF_NAME}"
          safe_branch=$(echo "$branch_name" | tr '/' '-')
          tag="v${app_version}-${safe_branch}"
          apk_name="${app_id}_${app_version}_release.apk"
          echo "app_id=$app_id" >> "$GITHUB_OUTPUT"
          echo "version=$app_version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=v${app_version} (${branch_name})" >> "$GITHUB_OUTPUT"
          echo "apk_name=$apk_name" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: android-release-apk
          path: android/app/build/outputs/apk/release/${{ steps.release-meta.outputs.apk_name }}
          retention-days: 7

  e2e-verify:
    name: Maestro Flows on Release Build (Android Emulator)
    needs: build-android
    # Public repos get free hardware-accelerated (KVM) Linux runners, which
    # is fast enough for the Android emulator without needing macOS.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Download release APK
        uses: actions/download-artifact@v7
        with:
          name: android-release-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Maestro suite on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          disable-spellchecker: true
          emulator-options: >-
            -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio
            -no-boot-anim -camera-back none
          script: |
            set -eu
            adb wait-for-device
            adb shell input keyevent 82
            adb install -r "${{ needs.build-android.outputs.apk_name }}"
            APP_ID="${{ needs.build-android.outputs.app_id }}"
            APP_VERSION="${{ needs.build-android.outputs.version }}"
            maestro test -e APP_ID="$APP_ID" -e APP_VERSION="$APP_VERSION" .maestro

  release:
    name: Create GitHub Release
    needs:
      - build-android
      - e2e-verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download release APK
        uses: actions/download-artifact@v7
        with:
          name: android-release-apk

      - name: Create GitHub release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.build-android.outputs.tag }}" \
            "${{ needs.build-android.outputs.apk_name }}" \
            --title "${{ needs.build-android.outputs.name }}" \
            --notes "Automated Android build from branch ${GITHUB_REF_NAME} (app version ${{ needs.build-android.outputs.version }}), verified with typecheck, lint, unit tests, and Maestro E2E." \
            --target "${{ github.sha }}" \
            --latest
